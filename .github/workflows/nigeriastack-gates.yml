name: Nigeria Stack verification
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'repair/**']
concurrency:
  group: verification-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install policy runner
        run: |
          curl -fL https://openpolicyagent.org/downloads/v1.22.4/opa_linux_amd64_static -o "$RUNNER_TEMP/opa"
          chmod +x "$RUNNER_TEMP/opa"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - run: pnpm run ci:verify-all-gates
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-verification
          path: verification-output/
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm --filter '@nigeriastack/*' build
      - run: pnpm --filter nigeriastack-org-portal build
      - name: Verify artboards and compiled portal
        run: |
          (cd apps/web && exec node scripts/serve.mjs) > "$RUNNER_TEMP/portal.log" 2>&1 &
          PORTAL_PID=$!
          trap 'kill "$PORTAL_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/ > /dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:3000/ > /dev/null
          NS_APP_BASE_URL=http://127.0.0.1:3000 pnpm exec playwright test tests/telemetry
      - name: Retain canonical viewport telemetry
        if: always()
        run: |
          if [ -f playwright-report/results.json ]; then
            cp playwright-report/results.json tests/telemetry/nigeriastack-viewport-telemetry.json
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: |
            playwright-output/
            playwright-report/
            apps/web/dist/reports/
            verification-output/native-zoom-evidence.json
            tests/telemetry/nigeriastack-viewport-telemetry.json

  release-evidence:
    needs: [source, browser]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
      - uses: actions/download-artifact@v4
        with:
          name: source-verification
          path: verification-output
      - uses: actions/download-artifact@v4
        with:
          name: browser-evidence
          path: .
      - name: Check evidence coherence without deploying
        run: |
          cp docs/handoff/evidence/github-access-restored-2026-11-17.json verification-output/github-access.json
          node --input-type=module <<'NODE'
          import { spawnSync } from 'node:child_process';
          import fs from 'node:fs';
          const run = spawnSync('node', ['scripts/ci/verify-release-readiness.mjs'], { encoding: 'utf8' });
          process.stdout.write(run.stdout || '');
          process.stderr.write(run.stderr || '');
          const report = JSON.parse(fs.readFileSync('verification-output/release-readiness.json', 'utf8'));
          const external = new Set(['Separate publicrelease authorization absent', 'Cloudflare productionbinding is a placeholder']);
          if (![0, 1].includes(run.status) || report.blockers.some(reason => !external.has(reason))) throw Error('Verification evidence is missing, stale or inconsistent');
          if (report.status === 'BLOCKED' && run.status !== 1) throw Error('Blocked release must return failure');
          if (report.status === 'READY_FOR_OPERATOR_REVIEW' && run.status !== 0) throw Error('Ready evidence must return success');
          console.log('Evidence coherent; publicReleasePerformed=' + report.publicReleasePerformed);
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-evidence
          path: verification-output/release-readiness.json
