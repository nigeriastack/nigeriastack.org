openapi: 3.1.1
info:
  title: NigeriaStack — Sub-National & 774-LGA Interoperable Municipal Services Contract
  version: 2026.6.5
  summary: Vendor-neutral OpenAPI 3.1.1 contract covering Pillars A–D across Nigeria's
    36 States, FCT, and 774 Local Government Areas (LGA-01 to LGA-14), enforcing SC/CV/343/2024
    zero-escrow treasury routing, Evidence Act s.84 seals, NDPA 2023 ClearAm consent,
    and KioskBase offline HLC-CRDT sync.
  license:
    name: CC0-1.0
    url: https://creativecommons.org/publicdomain/zero/1.0/
  contact:
    name: Digital Economic Development Initiative | DIGITECO — NigeriaStack WG-05
      & WG-03
    url: https://digiteco.org
components:
  parameters:
    NgStackOperationId:
      name: X-NgStack-Operation-Id
      in: header
      required: true
      schema:
        type: string
        pattern: ^cop_[0-9A-HJKMNP-TV-Z]{26}$
    NgStackIdempotencyKey:
      name: X-NgStack-Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 128
    NgStackClearAmToken:
      name: X-NgStack-ClearAm-Token
      in: header
      required: false
      description: Required on all personal, clinical, vital, or land-encumbrance
        endpoints (NS-RFC-006).
      schema:
        type: string
        pattern: ^clm_[0-9A-HJKMNP-TV-Z]{26}$
    NgStackSignatureEd25519:
      name: X-NgStack-Signature-Ed25519
      in: header
      required: true
      schema:
        type: string
        pattern: ^[A-Za-z0-9_-]{86}$
  schemas:
    SplitDirectTreasuryProof:
      type: object
      required:
      - statutoryAmountKobo
      - platformEscrowAmountKobo
      - stateIntermediaryEscrowKobo
      - destinationTreasuryAccountRef
      - settlementSwitch
      properties:
        statutoryAmountKobo:
          type: integer
          minimum: 1
        platformEscrowAmountKobo:
          type: integer
          const: 0
          description: Constitutional invariance under 1999 CFRN s.121(3) & SC/CV/343/2024.
        stateIntermediaryEscrowKobo:
          type: integer
          const: 0
          description: Prohibits SJLGA or intermediary escrow of LGA statutory revenues.
        destinationTreasuryAccountRef:
          type: string
          pattern: ^(FED|STATE|LGA)-[A-Z]{2}-[A-Z0-9-]{6,32}$
        settlementSwitch:
          type: string
          enum:
          - NIBSS_NIP
          - REMITA_TSA
          - SIRS_GATEWAY
          - CBN_LICENSED_PSP
    MunicipalServiceEnvelope:
      type: object
      required:
      - envelopeUlid
      - jurisdictionType
      - stateCode
      - moduleId
      - channel
      - hlcTimestamp
      - clockDriftStatus
      properties:
        envelopeUlid:
          type: string
          pattern: ^kbd_[0-9A-HJKMNP-TV-Z]{26}$
        jurisdictionType:
          type: string
          enum:
          - STATE_GOVERNMENT
          - FCT_ADMINISTRATION
          - LGA_COUNCIL
          - FCT_AREA_COUNCIL
        stateCode:
          type: string
          pattern: ^[A-Z]{2}$
        lgaCode:
          type: string
          pattern: ^[A-Z]{2}-LGA-[0-9]{2}$
        moduleId:
          type: string
          enum:
          - LGA-01
          - LGA-02
          - LGA-03
          - LGA-04
          - LGA-05
          - LGA-06
          - LGA-07
          - LGA-08
          - LGA-09
          - LGA-10
          - LGA-11
          - LGA-12
          - LGA-13
          - LGA-14
        channel:
          type: string
          enum:
          - KIOSKBASE_OFFLINE_PWA
          - USSD_347_LGA
          - WEB_PORTAL
          - PAPER_COUNTER_ASSISTED
        hlcTimestamp:
          type: string
          description: 48-bit UTC ms epoch + 16-bit logical counter + 16-char hardware
            node fingerprint.
        clockDriftStatus:
          type: string
          enum:
          - VERIFIED_SYNC
          - DEGRADED_LOCAL_HLC
        streetGridCode:
          type: string
          pattern: ^NG-[A-Z]{2}-[A-Z0-9]{6,12}$
        splitDirectTreasuryProof:
          $ref: '#/components/schemas/SplitDirectTreasuryProof'
        sureEvidenceCredentialId:
          type: string
          pattern: ^s84_[0-9A-HJKMNP-TV-Z]{26}$
    ErrorResponse:
      type: object
      required:
      - errorCode
      - message
      - governingRfc
      properties:
        errorCode:
          type: string
          enum:
          - CLEARAM_ARTIFACT_EXPIRED
          - CLEARAM_ARTIFACT_REVOKED
          - UNRESOLVED_OPERATION_LOCK
          - TREASURY_PASSTHROUGH_INVARIANCE_BREACH
          - S84_PAYLOAD_DIGEST_MISMATCH
          - NDPA_RESTRICTED_QUARANTINE_DENIED
        message:
          type: string
        governingRfc:
          type: string
paths:
  /v1/municipal/{stateCode}/{lgaCode}/treasury/settle:
    post:
      operationId: settleDirectCouncilTreasury
      summary: Pillar A — Direct-to-treasury TenementRate (LGA-09) & MarketCollect
        (LGA-10) settlement.
      parameters:
      - name: stateCode
        in: path
        required: true
        schema:
          type: string
          pattern: ^[A-Z]{2}$
      - name: lgaCode
        in: path
        required: true
        schema:
          type: string
          pattern: ^[A-Z]{2}-LGA-[0-9]{2}$
      - $ref: '#/components/parameters/NgStackOperationId'
      - $ref: '#/components/parameters/NgStackIdempotencyKey'
      - $ref: '#/components/parameters/NgStackSignatureEd25519'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MunicipalServiceEnvelope'
      responses:
        '202':
          description: Accepted asynchronously; final SureEvidence s.84 QR receipt
            delivered via /on_settle callback.
        '409':
          description: Duplicate retry blocked while original payment remains in UNKNOWN_TIMEOUT.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Rejected due to non-zero platform or state intermediary escrow
            (SC/CV/343/2024 breach).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/municipal/{stateCode}/{lgaCode}/permits/issue:
    post:
      operationId: issueMunicipalPermit
      summary: Pillar B — Issue BuildClear (LGA-02), ShopPermit (LGA-04), or SafetyNOC
        (LGA-07) with s.84 QR seal.
      parameters:
      - name: stateCode
        in: path
        required: true
        schema:
          type: string
          pattern: ^[A-Z]{2}$
      - name: lgaCode
        in: path
        required: true
        schema:
          type: string
          pattern: ^[A-Z]{2}-LGA-[0-9]{2}$
      - $ref: '#/components/parameters/NgStackOperationId'
      - $ref: '#/components/parameters/NgStackIdempotencyKey'
      - $ref: '#/components/parameters/NgStackClearAmToken'
      - $ref: '#/components/parameters/NgStackSignatureEd25519'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MunicipalServiceEnvelope'
      responses:
        '202':
          description: Permit queued; stages automatically if clockDriftStatus ==
            DEGRADED_LOCAL_HLC.
        '403':
          description: ClearAm consent token expired or revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/municipal/{stateCode}/{lgaCode}/civil/attest:
    post:
      operationId: attestVitalOrIndigeneRecord
      summary: Pillar C — VitalProof (LGA-05), IndigeneProof (LGA-06) & StreetGrid
        (LGA-14) attestation.
      parameters:
      - name: stateCode
        in: path
        required: true
        schema:
          type: string
          pattern: ^[A-Z]{2}$
      - name: lgaCode
        in: path
        required: true
        schema:
          type: string
          pattern: ^[A-Z]{2}-LGA-[0-9]{2}$
      - $ref: '#/components/parameters/NgStackOperationId'
      - $ref: '#/components/parameters/NgStackIdempotencyKey'
      - $ref: '#/components/parameters/NgStackClearAmToken'
      - $ref: '#/components/parameters/NgStackSignatureEd25519'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MunicipalServiceEnvelope'
      responses:
        '202':
          description: Attestation accepted for ward verification & SureEvidence QR
            issuance.
        '403':
          description: ClearAm consent missing, expired, or revoked (zero downstream
            DB queries executed).
  /v1/municipal/{stateCode}/{lgaCode}/civic/sync:
    post:
      operationId: syncOfflineCivicDelta
      summary: Pillar D — KioskBase HLC-CRDT sync for CouncilComplain (LGA-01), WashConnect
        (LGA-03), WardPHC (LGA-11) & CustomaryDocket (LGA-13).
      parameters:
      - name: stateCode
        in: path
        required: true
        schema:
          type: string
          pattern: ^[A-Z]{2}$
      - name: lgaCode
        in: path
        required: true
        schema:
          type: string
          pattern: ^[A-Z]{2}-LGA-[0-9]{2}$
      - $ref: '#/components/parameters/NgStackOperationId'
      - $ref: '#/components/parameters/NgStackIdempotencyKey'
      - $ref: '#/components/parameters/NgStackSignatureEd25519'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MunicipalServiceEnvelope'
      responses:
        '202':
          description: Offline delta accepted; restricted NDPA dockets partitioned
            into INTERNAL_RESTRICTED_NDPA.
        '403':
          description: Blocked attempt to push unsealed or NDPA-restricted docket
            into public outbox.
  /v1/audit/treasury-merkle-root:
    get:
      operationId: getDailyTreasuryMerkleRoot
      summary: Public 03 Audit endpoint proving zero SJLGA or platform escrow across
        settled receipts.
      parameters:
      - name: stateCode
        in: query
        required: true
        schema:
          type: string
          pattern: ^[A-Z]{2}$
      - name: logDateUtc
        in: query
        required: true
        schema:
          type: string
          format: date
      responses:
        '200':
          description: Daily SHA-256 RFC 9162 Merkle root attestation proving zero
            intermediary escrow.
