openapi: 3.1.1
info:
  title: Nigeria Stack — GivePower Autonomous Agent Delegation & MCP Safety Contract
  version: 2026.6.2
  summary: Draft interface for read-only access, project-required countersignatures for mutations, and a local two-phase settlement profile (NS-RFC-008).
  license:
    name: Apache-2.0
    identifier: Apache-2.0
paths:
  /v1/mcp/operations/{operationId}:
    get:
      operationId: getMcpOperationStatusReadOnly
      summary: Read-only operation status lookup permitted for autonomous agents by default.
      parameters:
        - name: operationId
          in: path
          required: true
          schema: { type: string, pattern: '^cop_[0-9A-HJKMNP-TV-Z]{26}$' }
      responses:
        '200':
          description: Deterministic operation status and SureEvidence digest reference.
  /v1/mcp/mutating-actions:
    post:
      operationId: executeCounterSignedAgentMutation
      summary: State-mutating agent call requiring a valid humanCountersignatureEd25519 header.
      parameters:
        - name: humanCountersignatureEd25519
          in: header
          required: true
          description: Unpadded base64url signature over the complete action mandate.
          schema: { type: string, pattern: '^[A-Za-z0-9_-]{85}[AQgw]$' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../../schemas/json-schema-2020-12/GivePowerAgentMandate.schema.json'
      responses:
        '202':
          description: Counter-signed mutation accepted.
        '402':
          description: x402 Two-Phase Escrow challenge issued; funds release only upon verified 200 OK delivery.
        '403':
          description: Blocked — missing or invalid humanCountersignatureEd25519 under the GivePower profile.
