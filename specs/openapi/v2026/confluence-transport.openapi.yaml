openapi: 3.1.1
info:
  title: Nigeria Stack — Confluence Gateway Signed Asynchronous Transport Contract
  version: 2026.6.2
  summary: Vendor-neutral OpenAPI 3.1.1 specification for asynchronous request/callback pairing, idempotency, and 6-state operation recovery (NS-RFC-002 & NS-RFC-003).
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
components:
  parameters:
    NgStackOperationId:
      name: X-NgStack-Operation-Id
      in: header
      required: true
      schema:
        type: string
        pattern: '^cop_[0-9A-HJKMNP-TV-Z]{26}$'
    NgStackIdempotencyKey:
      name: X-NgStack-Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 128
    NgStackSignatureEd25519:
      name: X-NgStack-Signature-Ed25519
      in: header
      required: true
      schema:
        type: string
        pattern: '^[A-Za-z0-9_-]{86}$'
    NgStackTimestamp:
      name: X-NgStack-Timestamp-Utc
      in: header
      required: true
      schema: { type: string, format: date-time }
    NgStackKeyId:
      name: X-NgStack-Key-Id
      in: header
      required: true
      schema: { type: string, format: uri }
    Sector:
      name: sector
      in: path
      required: true
      schema: { type: string, minLength: 1 }
    Action:
      name: action
      in: path
      required: true
      schema: { type: string, minLength: 1 }
  schemas:
    ConfluenceAsyncAck:
      $ref: '../../schemas/json-schema-2020-12/ConfluenceAsyncEnvelope.schema.json'
paths:
  /v1/{sector}/{action}:
    post:
      operationId: initiateConfluenceOperation
      summary: Submit an operation using its original customer reference and idempotency key.
      parameters:
        - $ref: '#/components/parameters/Sector'
        - $ref: '#/components/parameters/Action'
        - $ref: '#/components/parameters/NgStackOperationId'
        - $ref: '#/components/parameters/NgStackIdempotencyKey'
        - $ref: '#/components/parameters/NgStackTimestamp'
        - $ref: '#/components/parameters/NgStackKeyId'
        - $ref: '#/components/parameters/NgStackSignatureEd25519'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [customerReference]
              properties:
                customerReference: { type: string, minLength: 1 }
      responses:
        '202':
          description: Operation acknowledged for asynchronous processing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfluenceAsyncAck'
        '403':
          description: ClearAm artifact expired or outside its scope.
        '409':
          description: Retry rejected because the original operation remains unresolved.
  /v1/{sector}/on_{action}:
    post:
      operationId: receiveConfluenceOutcome
      summary: Deliver the signed operation outcome to the registered participant.
      parameters:
        - $ref: '#/components/parameters/Sector'
        - $ref: '#/components/parameters/Action'
        - $ref: '#/components/parameters/NgStackOperationId'
        - $ref: '#/components/parameters/NgStackIdempotencyKey'
        - $ref: '#/components/parameters/NgStackTimestamp'
        - $ref: '#/components/parameters/NgStackKeyId'
        - $ref: '#/components/parameters/NgStackSignatureEd25519'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfluenceAsyncAck'
      responses:
        '204':
          description: Participant recorded the outcome.
        '403':
          description: Callback signature or sender authorization failed.
